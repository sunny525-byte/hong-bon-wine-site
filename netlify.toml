[build]
  command = "node generate.mjs"
  publish = "."
  edge_functions = "netlify/edge-functions"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Send the default *.netlify.app host to the canonical domain so search engines
# don't see two copies of the site. Matches this host only, so deploy previews
# (deploy-preview-N--hongbon.netlify.app) are unaffected.
[[redirects]]
  from = "https://hongbon.netlify.app/*"
  to = "https://hongbon.tw/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Internal sources are not part of the website.
#
# publish = "." serves the whole repository root, so build sources, docs and
# original images would otherwise be readable at hongbon.tw — the edge function
# source was publicly served before these rules were added. None of these paths
# is referenced by any generated page (verified), so returning 404 is safe.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/CONTRIBUTING.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/SECURITY.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/CHANGELOG.md"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/_templates/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/policies/*"
  to = "/"
  status = 404
  force = true
# original PNGs: the site serves /assets/*.webp instead
[[redirects]]
  from = "/product-images/*"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/generate.mjs"
  to = "/"
  status = 404
  force = true
[[redirects]]
  from = "/.gitignore"
  to = "/"
  status = 404
  force = true
